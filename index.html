<!DOCTYPE html>
<html lang="pt-BR">
<head><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#667eea">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Um aplicativo de tarefas moderno e funcional">
    <title>Meu Todo App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js")
    .then(() => console.log("✅ PWA ativado"))
    .catch(err => console.log("❌ Erro no PWA:", err));
}
</script>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>📝 Minhas Tarefas</h1>
            <p class="subtitle">Organize suas tarefas de forma simples e eficiente</p>
        </header>

        <!-- Main Content -->
        <main class="app-main">
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="Adicione uma nova tarefa..."
                        autocomplete="off"
                    >
                    <button id="addBtn" class="btn btn-add">Adicionar</button>
                </div>
            </section>

            <!-- Filter Section -->
            <section class="filter-section">
                <button class="filter-btn active" data-filter="all">
                    <span>Todas</span>
                    <span class="count" id="countAll">0</span>
                </button>
                <button class="filter-btn" data-filter="pending">
                    <span>Pendentes</span>
                    <span class="count" id="countPending">0</span>
                </button>
                <button class="filter-btn" data-filter="completed">
                    <span>Completas</span>
                    <span class="count" id="countCompleted">0</span>
                </button>
            </section>

            <!-- Tasks List -->
            <section class="tasks-section">
                <div id="tasksList" class="tasks-list">
                    <!-- Tasks will be rendered here -->
                </div>
                <div id="emptyState" class="empty-state">
                    <p>🎯 Nenhuma tarefa ainda. Crie uma para começar!</p>
                </div>
            </section>

            <!-- Statistics -->
            <section class="stats-section">
                <div class="stat-card">
                    <h3>Total de Tarefas</h3>
                    <p class="stat-number" id="statTotal">0</p>
                </div>
                <div class="stat-card">
                    <h3>Completas</h3>
                    <p class="stat-number" id="statCompleted">0</p>
                </div>
                <div class="stat-card">
                    <h3>Progresso</h3>
                    <p class="stat-number" id="statProgress">0%</p>
                </div>
            </section>

            <!-- Action Buttons -->
            <section class="actions-section">
                <button id="clearCompletedBtn" class="btn btn-danger btn-small">
                    🗑️ Limpar Completas
                </button>
                <button id="clearAllBtn" class="btn btn-danger btn-small">
                    ⚠️ Limpar Todas
                </button>
            </section>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>✨ Desenvolvido com JavaScript | Kauã Campos © 2026</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
